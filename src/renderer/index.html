<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>d3m3nk0</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside id="sidebar">
      <div class="brand">d3m3nk0<span class="ver">0.1</span></div>
      <div id="sidebar-resizer" role="separator" aria-orientation="vertical" tabindex="0"
           title="Потяните, чтобы изменить ширину. Двойной клик — исходная ширина"></div>
      <button id="new-session" class="ghost">+ Новая сессия</button>
      <div id="sessions" class="sessions"></div>
      <div class="sidebar-foot">
        <button id="open-settings" class="ghost">Настройки</button>
      </div>
    </aside>

    <main>
      <header>
        <div class="badges">
          <button id="model-badge" class="badge badge-btn" title="Сменить модель">—</button>
          <span id="workdir-badge" class="badge path" title="Рабочая папка">—</span>
          <span id="mcp-badge" class="badge">MCP: 0</span>
        </div>
      </header>

      <section id="transcript" aria-live="polite"></section>

      <section id="permission-area"></section>

      <footer>
        <textarea id="input" rows="3" placeholder="Опиши задачу… Enter — отправить, Shift+Enter — новая строка"></textarea>
        <div class="composer-actions">
          <span id="hint" class="hint"></span>
          <button id="stop" class="danger" hidden>Стоп</button>
          <button id="send">Отправить</button>
        </div>
      </footer>
    </main>

    <dialog id="settings">
      <form method="dialog" class="settings-form">
        <h2>Настройки</h2>

        <label>Провайдер
          <select id="s-provider">
            <option value="anthropic">Anthropic</option>
            <option value="openai">OpenAI-совместимый</option>
          </select>
        </label>

        <label>Модель
          <input id="s-model" placeholder="claude-sonnet-4-5" />
        </label>

        <label>Base URL
          <input id="s-baseurl" placeholder="https://api.anthropic.com" />
        </label>

        <label>API-ключ
          <input id="s-apikey" type="password" placeholder="ключ хранится в ~/.d3m3nk0/config.json" />
        </label>

        <label>Рабочая папка
          <input id="s-workdir" placeholder="C:\\путь\\к\\проекту" />
        </label>

        <label>Политика доступа
          <select id="s-permission">
            <option value="ask">ask — спрашивать про правки и команды</option>
            <option value="allow-edits">allow-edits — правки без спроса, команды с подтверждением</option>
            <option value="yolo">yolo — ничего не спрашивать</option>
          </select>
        </label>

        <label>MCP-серверы (JSON)
          <textarea id="s-mcp" rows="6" spellcheck="false"></textarea>
        </label>

        <div class="dialog-actions">
          <button value="cancel" class="ghost">Отмена</button>
          <button id="save-settings" value="default">Сохранить</button>
        </div>
      </form>
    </dialog>

    <script src="markdown.js"></script>
    <script src="app.js"></script>
  </body>
</html>
